[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycppcrypt"
version = "0.1.0"
description = "AES-256-GCM file and text encryption using Python and C++/OpenSSL"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "sparkj365-create"}]
dependencies = [
    "pycryptodome>=3.20,<4",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
pycppcrypt = "pycppcrypt.cli:main"

[tool.setuptools.packages.find]
include = ["pycppcrypt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
